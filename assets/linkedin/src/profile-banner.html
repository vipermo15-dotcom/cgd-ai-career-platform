<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>LinkedIn 프로필 배너</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F6F3EE; --ink:#16181D; --sub:#5B606B; --blue:#1F3FBF; --blue-soft:#E4E9FB; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1584px; height:396px; }
  body { background:var(--bg); font-family:'Noto Sans KR', sans-serif; color:var(--ink); position:relative; overflow:hidden; }
  /* 왼쪽 1/3은 프로필 사진 영역 — 비워 둠 */
  .art { position:absolute; left:528px; top:0; right:0; bottom:0; padding:56px 72px 0 64px; }
  .title { font-size:22px; font-weight:700; color:var(--blue); letter-spacing:.04em; }
  .headline { font-size:52px; font-weight:900; letter-spacing:-.02em; line-height:1.2; margin-top:14px; }
  .chips { display:flex; flex-wrap:wrap; gap:12px; margin-top:30px; max-width:820px; }
  .chip { font-size:22px; font-weight:700; padding:10px 22px; border-radius:999px; background:#fff; border:2px solid #DAD5CC; }
  .chip.ai { background:var(--blue); border-color:var(--blue); color:#fff; }
  .shape { position:absolute; border-radius:50%; }
  .s1 { width:340px; height:340px; right:-90px; top:-110px; background:var(--blue); }
  .s2 { width:180px; height:180px; right:170px; bottom:-90px; background:var(--blue-soft); }
  .s3 { width:84px; height:84px; right:340px; top:56px; border:10px solid var(--blue); border-radius:24px; transform:rotate(14deg); }
</style>
</head>
<body>
  <div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div>
  <div class="art">
    <div class="title">서울시기술교육원 컴퓨터그래픽디자인과 | Design × AI</div>
    <div class="headline">실무에서 바로 통하는<br>디자이너를 키웁니다</div>
    <div class="chips">
      <span class="chip">브랜드</span><span class="chip">편집</span><span class="chip">패키지</span>
      <span class="chip">굿즈</span><span class="chip">콘텐츠</span><span class="chip">숏폼</span><span class="chip ai">+ AI</span>
    </div>
  </div>
</body>
</html>
